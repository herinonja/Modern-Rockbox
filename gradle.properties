# Configuration JVM & Gradle optimisée macOS (Temurin 21 / Apple Silicon & Intel)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Désactive le daemon en tâche de fond pour exécution directe sans crash socket / OOM
org.gradle.daemon=false
org.gradle.parallel=false

# Active AndroidX obligatoire pour AGP 8.x et la bibliothèque officielle WebKit
android.useAndroidX=true
android.enableJetifier=false

# Optimisations de compilation moderne
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.caching=true